name: CI/CD - Run Chessboard GUI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25' 
          distribution: 'temurin'

      - name: Install Xvfb (Virtual Display for GUI testing)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Compile Java Sources and Copy Resources
        run: |
          mkdir -p out
          
          # 1. Finds and compiles all .java files in the src folder into the out folder
          javac -d out -sourcepath src $(find src -name "*.java")
          
          # 2. Copy all non-Java files (like .png images) from src/ to out/
          rsync -a --exclude="*.java" src/ out/

      - name: Run ChessboardGui
        # Uses xvfb-run to simulate a display and timeout to safely kill the infinite event loop
        run: timeout 15s xvfb-run java -cp out chessboard.ChessboardGui || [ $? -eq 124 ]
